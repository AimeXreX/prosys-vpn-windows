name: ProSyS VPN for Windows

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package
        run: prosys/package-windows.sh ${{ matrix.arch }} "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: ProSySVPN-windows-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ProSyS VPN for Windows ${{ github.ref_name }}

            - Portable zip for x64 and arm64 (unzip, then run ProSySVPN.exe)
            - Free service: 500 MB per PC per day, renewed at 00:00 Tehran time
            - SHA-256 checksum next to each zip

            Based on v2rayN (GPL-3.0). The original license and attribution are preserved.
