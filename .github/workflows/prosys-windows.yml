name: ProSyS VPN for Windows

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    # Windows runner: Inno Setup 6 is preinstalled there, so the Setup installer is built next to the zip.
    runs-on: windows-2025
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests (routing, DNS, subscription info, config generation)
        if: matrix.arch == 'x64'
        run: dotnet run --project v2rayN/ServiceLib.Tests -c Release

      - name: Package (zip + Setup)
        run: prosys/package-windows.sh ${{ matrix.arch }} "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: ProSySVPN-windows-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: prosys/release-notes
      - name: Pick release notes
        run: |
          notes="src/prosys/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "ProSyS VPN for Windows ${GITHUB_REF_NAME}" > release-notes.md; fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
